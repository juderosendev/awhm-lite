[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awhm-lite"
version = "0.3.0"
description = "External long-term memory for LLM agents. Fully local, zero LLM calls."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "spacy>=3.7",
    "dateparser>=1.2",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
mcp = ["mcp[cli]>=1.2"]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
awhm = "awhm.cli.main:main"
awhm-mcp = "awhm.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["awhm"]
